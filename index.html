<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Point Invoice</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-green: #34c759;
            --apple-blue: #0071e3;
            --tennis-accent: #1e4620;
            --tennis-neon: #ccff00;
        }

        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }

        body {
            background-color: var(--apple-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--apple-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .form-group { margin-bottom: 20px; width: 100%; }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 16px;
        }

        .btn-print {
            background: var(--tennis-accent);
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* CORRECCIÓN PARA IMPRESIÓN */
        @media print {
            @page {
                margin: 0 !important; /* Fuerza a eliminar pies de página */
            }

            body {
                background: white !important;
                padding: 0 !important;
            }

            .container {
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100% !important;
                padding: 20mm !important;
                /* Eliminamos position: fixed y usamos transform para el escalado */
                transform: scale(0.95);
                transform-origin: top left;
            }

            /* Ocultamos elementos innecesarios */
            .top-bar, .action-bar, .btn-manual, .switch-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <select id="langSelect"><option value="es">Castellano</option></select>
    </div>

    <form id="invoiceForm">
        <div class="section-box">
            <h3>Emisor de Factura</h3>
            <div class="form-group">
                <input type="text" id="titular" placeholder="Club de Tenis Premium">
            </div>
            <div class="form-group fecha-form-group">
                <input type="date" id="fechaFactura">
            </div>
        </div>

        <div class="section-box">
            <h3>Cliente</h3>
            <div class="form-group">
                <input type="text" id="cliente" placeholder="Nombre completo">
            </div>
        </div>

        <div class="results-panel">
            <div class="result-row">Total: <span id="resTotal">0.00 €</span></div>
        </div>

        <div class="action-bar">
            <button type="button" class="btn-print" onclick="window.print()">Imprimir Factura</button>
        </div>
    </form>
</div>

<script>
    // Inicializar fecha
    document.getElementById('fechaFactura').valueAsDate = new Date();
</script>
</body>
</html>

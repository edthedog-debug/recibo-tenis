<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Point Invoice - Mobile Edition</title>
    <!-- Librería para generar PDFs perfectos en una sola hoja -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-green: #34c759;
            --apple-blue: #0071e3;
            --tennis-accent: #1e4620;
            --tennis-neon: #ccff00;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 500px; /* Estilo compacto tipo móvil también en PC */
            background: var(--apple-card);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            padding: 24px;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e5ea;
        }

        .lang-selector select {
            background: rgba(0,0,0,0.05);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--apple-text);
            outline: none;
            cursor: pointer;
        }

        .btn-manual {
            background: var(--apple-bg);
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--apple-blue);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .flex-vertical-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .section-box {
            background: #fafafa;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #f0f0f2;
            width: 100%;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--tennis-accent);
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: -0.3px;
        }

        .form-group {
            margin-bottom: 15px;
            width: 100%;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--apple-text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], 
        input[type="number"], 
        textarea,
        input[type="date"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d2d2d7;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--apple-text);
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .tax-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            margin-top: 15px;
        }

        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 500;
            gap: 15px;
            width: 100%;
        }

        .switch-container input[type="checkbox"] {
            width: 42px;
            height: 24px;
            appearance: none;
            background: #e5e5ea;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: background 0.2s;
            margin: 0;
        }

        .switch-container input[type="checkbox"]:checked {
            background: var(--apple-green);
        }

        .switch-container input[type="checkbox"]::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }

        .switch-container input[type="checkbox"]:checked::before {
            transform: translateX(18px);
        }

        .results-panel {
            background: var(--apple-text);
            color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .result-row.total {
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            opacity: 1;
            color: var(--tennis-neon);
        }

        .action-bar {
            margin-top: 20px;
        }

        .btn-print {
            background: var(--tennis-accent);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s;
            border-bottom: 3px solid var(--tennis-neon);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e5e5ea;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .btn-close-cross {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .oculto-interfaz { display: none !important; }
        .ocultar-pdf { display: none !important; }

        /* ----------------------------------------------------------- */
        /* ESTILOS DE VISTA PREVIA IMPRESIÓN (IDÉNTICO A FORMATO MÓVIL) */
        /* ----------------------------------------------------------- */
        .pdf-clonado-container {
            background: #ffffff !important;
            padding: 30px !important;
            box-sizing: border-box !important;
            display: block !important;
            width: 620px !important; /* Forzamos ancho exacto vertical */
            margin: 0 auto !important;
        }

        .pdf-clonado-container .top-bar, 
        .pdf-clonado-container .action-bar, 
        .pdf-clonado-container .tax-options {
            display: none !important;
        }

        .pdf-clonado-container .section-box {
            padding: 16px !important;
            background: #ffffff !important;
            border: 1px solid #e5e5ea !important;
            border-radius: 12px !important;
            margin-bottom: 15px !important;
        }

        .pdf-valor-texto {
            font-size: 1rem !important;
            color: #1d1d1f !important;
            padding: 4px 0 !important;
            font-weight: 500 !important;
            border-bottom: 1px dashed #d2d2d7 !important;
        }

        .pdf-clonado-container .results-panel {
            background: #f5f5f7 !important;
            color: #1d1d1f !important;
            border: 1px solid #d2d2d7 !important;
            padding: 16px !important;
            border-radius: 12px !important;
        }

        .pdf-clonado-container .result-row.total {
            color: #1e4620 !important;
            border-top: 2px solid #1e4620 !important;
        }
    </style>
</head>
<body>

<div class="container" id="invoiceContainer">
    <div class="top-bar">
        <div class="lang-selector">
            <select id="langSelect" onchange="cambiarIdioma()">
                <option value="es">Castellano</option>
                <option value="cat">Català</option>
                <option value="en">English</option>
            </select>
        </div>
        <button type="button" class="btn-manual" id="lblManualBtn" onclick="toggleManual(true)">Manual de Uso</button>
    </div>

    <form id="invoiceForm">
        <div class="flex-vertical-stack">
            
            <div class="section-box" id="secEmisor">
                <h3 class="section-title" id="lblEmisor">Emisor de Factura</h3>
                <div class="flex-vertical-stack" style="gap: 12px;">
                    <div class="form-group" id="fgTitular">
                        <label id="lblTitular">Nombre del Titular / Club</label>
                        <input type="text" id="titular" placeholder="Club de Tenis Premium">
                    </div>
                    
                    <div class="switch-container" style="background: #ffffff; padding: 10px; border-radius: 12px; border: 1px solid #e5e5ea;">
                        <span id="lblFechaSwitch">Incluir fecha en la factura</span>
                        <input type="checkbox" id="mostrarFechaSwitch" checked onchange="toggleFechaInterfaz()">
                    </div>

                    <div class="form-group" id="fgFecha">
                        <label id="lblFechaFactura">Fecha de Factura</label>
                        <input type="date" id="fechaFactura">
                    </div>
                </div>
            </div>

            <div class="section-box" id="secCliente">
                <h3 class="section-title" id="lblClienteSec">Cliente</h3>
                <div class="form-group" id="fgCliente">
                    <label id="lblClienteNom">Nombre del Cliente</label>
                    <input type="text" id="cliente" placeholder="Nombre completo">
                </div>
                <div class="form-group" id="fgDireccion">
                    <label id="lblDireccion">Dirección del Cliente</label>
                    <textarea id="direccion" rows="2" placeholder="Dirección física"></textarea>
                </div>
            </div>

            <div class="section-box" id="secDetalles">
                <h3 class="section-title" id="lblDetalles">Detalles del Servicio</h3>
                <div class="form-group" id="fgAsunto">
                    <label id="lblAsunto">Asunto / Concepto (Obligatorio)</label>
                    <input type="text" id="asunto" placeholder="Ej. Alquiler de Pistas e Inscripción a Torneo">
                </div>

                <div class="form-group" id="fgImporte" style="margin-top: 12px;">
                    <label id="lblImporte">Importe Base (€)</label>
                    <input type="number" id="importe" step="0.01" min="0" placeholder="0.00" oninput="calcularTotales()">
                </div>

                <div class="tax-options">
                    <div class="switch-container">
                        <span id="lblIvaSwitch">Aplicar IVA (21%)</span>
                        <input type="checkbox" id="ivaSwitch" onchange="calcularTotales()">
                    </div>
                    <div class="switch-container">
                        <span id="lblIrpfSwitch">Aplicar IRPF (15%)</span>
                        <input type="checkbox" id="irpfSwitch" onchange="calcularTotales()">
                    </div>
                </div>
            </div>

        </div>

        <div class="results-panel">
            <div class="result-row" id="rowSubtotal">
                <span id="lblResSubtotal">Subtotal Base:</span>
                <span id="resSubtotal">0.00 €</span>
            </div>
            <div class="result-row" id="rowIva">
                <span id="lblResIva">IVA (21%):</span>
                <span id="resIva">0.00 €</span>
            </div>
            <div class="result-row" id="rowIrpf">
                <span id="lblResIrpf">IRPF (15%):</span>
                <span id="resIrpf">0.00 €</span>
            </div>
            <div class="result-row total">
                <span id="lblResTotal">Total Factura:</span>
                <span id="resTotal">0.00 €</span>
            </div>
        </div>

        <div class="action-bar">
            <button type="button" class="btn-print" id="lblImprimirBtn" onclick="generarPDFUnificado()">Generar factura 📄</button>
        </div>
    </form>
</div>

<div class="modal" id="manualModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="lblManualTitulo">Manual de Instrucciones</h3>
            <button type="button" class="btn-close-cross" onclick="toggleManual(false)">&times;</button>
        </div>
        <div class="modal-body">
            <ol id="manualPasos"></ol>
        </div>
    </div>
</div>

<script>
const traducciones = {
    es: {
        lblManualBtn: "Manual de Uso", lblEmisor: "Emisor de Factura", lblTitular: "Nombre del Titular / Club", 
        lblFechaSwitch: "Incluir fecha en la factura", lblFechaFactura: "Fecha de Factura",
        lblClienteSec: "Cliente", lblClienteNom: "Nombre del Cliente", lblDireccion: "Dirección del Cliente",
        lblDetalles: "Detalles del Servicio", lblAsunto: "Asunto / Concepto (Obligatorio)", lblImporte: "Importe Base (€)",
        lblIvaSwitch: "Aplicar IVA (21%)", lblIrpfSwitch: "Aplicar IRPF (15%)", lblResSubtotal: "Subtotal Base:",
        lblResIva: "IVA (21%):", lblResIrpf: "IRPF (15%):", lblResTotal: "Total Factura:",
        lblImprimirBtn: "Generar factura 📄", lblManualTitulo: "Manual de Instrucciones",
        titular: "Club de Tenis Premium", cliente: "Nombre completo", direccion: "Dirección física", asunto: "Ej. Alquiler de Pistas e Inscripción a Torneo",
        pasos: [
            "Rellene los datos obligatorios del emisor, cliente e importe base.",
            "Pulse el botón <strong>'Generar factura 📄'</strong> para exportar de forma directa un archivo PDF perfectamente ajustado en una sola hoja.",
            "El PDF se generará con orientación vertical (A4) de manera nativa e idéntica tanto en el móvil como en el ordenador."
        ]
    }
};

function cambiarIdioma() {
    const trans = traducciones.es;
    for (let key in trans) {
        if (key !== 'pasos') {
            const el = document.getElementById(key);
            if (el) {
                if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
                    el.placeholder = trans[key];
                } else {
                    el.innerHTML = trans[key];
                }
            }
        }
    }
    const ol = document.getElementById('manualPasos');
    ol.innerHTML = "";
    trans.pasos.forEach(paso => {
        const li = document.createElement('li');
        li.innerHTML = paso;
        ol.appendChild(li);
    });
}

function formatearMoneda(valor) {
    return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valor) + " €";
}

function calcularTotales() {
    const importeBase = parseFloat(document.getElementById('importe').value) || 0;
    const aplicarIva = document.getElementById('ivaSwitch').checked;
    const aplicarIrpf = document.getElementById('irpfSwitch').checked;

    let ivaCalculado = 0; if (aplicarIva) ivaCalculado = importeBase * 0.21;
    let irpfCalculado = 0; if (aplicarIrpf) irpfCalculado = importeBase * 0.15;

    const total = importeBase + ivaCalculado + irpfCalculado;

    document.getElementById('resSubtotal').innerText = formatearMoneda(importeBase);
    document.getElementById('resIva').innerText = formatearMoneda(ivaCalculado);
    document.getElementById('resIrpf').innerText = formatearMoneda(irpfCalculado);
    document.getElementById('resTotal').innerText = formatearMoneda(total);

    document.getElementById('rowIva').className = aplicarIva ? 'result-row' : 'result-row ocultar-pdf';
    document.getElementById('rowIrpf').className = aplicarIrpf ? 'result-row' : 'result-row ocultar-pdf';
}

function toggleFechaInterfaz() {
    const check = document.getElementById('mostrarFechaSwitch').checked;
    document.getElementById('fgFecha').className = check ? 'form-group' : 'form-group oculto-interfaz';
}

function toggleManual(mostrar) {
    document.getElementById('manualModal').style.display = mostrar ? 'flex' : 'none';
}

function generarPDFUnificado() {
    const origen = document.getElementById('invoiceContainer');
    const clon = origen.cloneNode(true);
    
    const topBarClon = clon.querySelector('.top-bar');
    if (topBarClon) topBarClon.remove();

    const campos = ['titular', 'fechaFactura', 'cliente', 'direccion', 'asunto', 'importe'];
    campos.forEach(id => {
        const elementoOriginal = document.getElementById(id);
        const elementoClonado = clon.querySelector('#' + id);
        if (elementoOriginal && elementoClonado) {
            const divTexto = document.createElement('div');
            divTexto.className = 'pdf-valor-texto';
            if (id === 'importe') {
                divTexto.innerText = formatearMoneda(parseFloat(elementoOriginal.value) || 0);
            } else {
                divTexto.innerText = elementoOriginal.value || ' ';
            }
            elementoClonado.parentNode.replaceChild(divTexto, elementoClonado);
        }
    });

    const incluirFecha = document.getElementById('mostrarFechaSwitch').checked;
    if (!incluirFecha) {
        const fgFechaClon = clon.querySelector('#fgFecha');
        if (fgFechaClon) fgFechaClon.remove();
    }

    if (!document.getElementById('ivaSwitch').checked) {
        const rIva = clon.querySelector('#rowIva'); if (rIva) rIva.remove();
    }
    if (!document.getElementById('irpfSwitch').checked) {
        const rIrpf = clon.querySelector('#rowIrpf'); if (rIrpf) rIrpf.remove();
    }

    clon.classList.remove('container');
    clon.classList.add('pdf-clonado-container');

    const opcionesConfig = {
        margin:       [15, 15, 15, 15],
        filename:     'factura_match_point.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false, windowWidth: 640 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    // Al usar html2pdf garantizamos que en PC no afecte la orientación previa del navegador
    html2pdf().set(opcionesConfig).from(clon).save();
}

window.onload = function() {
    document.getElementById('fechaFactura').value = new Date().toISOString().split('T')[0];
    cambiarIdioma();
    calcularTotales();
};
</script>
</body>
</html>

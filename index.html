<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Point Invoice</title>
    <!-- Cargamos las librerías desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .section-box { margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: #1e4620; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container" id="factura">
    <h2>Factura</h2>
    <div class="section-box">
        <label>Nombre del Cliente</label>
        <input type="text" id="cliente" placeholder="Escribe aquí...">
    </div>
    <div class="section-box">
        <label>Importe (€)</label>
        <input type="number" id="importe" placeholder="0.00">
    </div>
    <button onclick="generarPDF()">Descargar PDF</button>
</div>

<script>
    async function generarPDF() {
        const { jsPDF } = window.jspdf;
        const elemento = document.getElementById('factura');

        try {
            // Capturamos el elemento como imagen
            const canvas = await html2canvas(elemento, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');

            // Creamos el PDF
            const pdf = new jsPDF('p', 'mm', 'a4');
            const anchoPDF = 210;
            const altoPDF = (canvas.height * anchoPDF) / canvas.width;

            pdf.addImage(imgData, 'PNG', 0, 0, anchoPDF, altoPDF);
            pdf.save("Factura.pdf");
        } catch (error) {
            console.error("Error al generar:", error);
            alert("Hubo un error al generar el PDF.");
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Point Invoice - Mobile Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-green: #34c759;
            --apple-blue: #0071e3;
            --tennis-accent: #1e4620;
            --tennis-neon: #ccff00;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--apple-bg); color: var(--apple-text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }

        .container { width: 100%; max-width: 900px; background: var(--apple-card); border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.06); padding: 40px; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #e5e5ea; }

        .btn-manual { background: var(--apple-bg); border: 1px solid rgba(0,0,0,0.1); color: var(--apple-blue); padding: 8px 16px; border-radius: 10px; cursor: pointer; }

        .flex-vertical-stack { display: flex; flex-direction: column; gap: 25px; margin-bottom: 25px; }

        .section-box { background: #fafafa; padding: 24px; border-radius: 16px; border: 1px solid #f0f0f2; }

        .section-title { font-size: 1.2rem; font-weight: 600; color: var(--tennis-accent); margin-bottom: 20px; }

        input, textarea { width: 100%; padding: 14px 16px; border: 1.5px solid #d2d2d7; border-radius: 12px; font-size: 1rem; }

        .results-panel { background: var(--apple-text); color: #ffffff; padding: 25px; border-radius: 16px; margin-top: 30px; }

        .btn-print { background: var(--tennis-accent); color: #ffffff; border: none; width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 600; border-radius: 14px; cursor: pointer; }

        /* Estilo oculto para el PDF */
        @media print { .top-bar, .action-bar, .btn-manual { display: none !important; } }
    </style>
</head>
<body>

<div class="container" id="facturaContainer">
    <div class="top-bar">
        <select id="langSelect" onchange="cambiarIdioma()"><option value="es">Castellano</option><option value="cat">Català</option><option value="en">English</option></select>
        <button type="button" class="btn-manual" onclick="toggleManual(true)">Manual</button>
    </div>

    <form id="invoiceForm">
        <div class="flex-vertical-stack">
            <div class="section-box">
                <h3 class="section-title" id="lblEmisor">Emisor de Factura</h3>
                <input type="text" id="titular" placeholder="Club de Tenis">
            </div>
            <div class="section-box">
                <h3 class="section-title" id="lblClienteSec">Cliente</h3>
                <input type="text" id="cliente" placeholder="Nombre completo">
                <textarea id="direccion" rows="2" placeholder="Dirección"></textarea>
            </div>
            <div class="section-box">
                <h3 class="section-title" id="lblDetalles">Detalles</h3>
                <input type="text" id="asunto" placeholder="Concepto" oninput="calcularTotales()">
                <input type="number" id="importe" placeholder="0.00 €" oninput="calcularTotales()" style="margin-top:10px;">
            </div>
        </div>

        <div class="results-panel">
            <div class="result-row"><span>Total:</span> <span id="resTotal">0.00 €</span></div>
        </div>

        <div class="action-bar" style="margin-top: 30px;">
            <button type="button" class="btn-print" onclick="imprimirFactura()">Descargar PDF 📄</button>
        </div>
    </form>
</div>

<script>
    async function imprimirFactura() {
        const { jsPDF } = window.jspdf;
        const container = document.getElementById('facturaContainer');

        // Generar canvas del contenedor
        const canvas = await html2canvas(container, { scale: 2, useCORS: true });
        const imgData = canvas.toDataURL('image/png');
        
        // Crear PDF
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 210; 
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
        pdf.save("Factura.pdf");
    }

    function calcularTotales() {
        const importe = parseFloat(document.getElementById('importe').value) || 0;
        document.getElementById('resTotal').innerText = importe.toFixed(2) + " €";
    }
</script>
</body>
</html>
